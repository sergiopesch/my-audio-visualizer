<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180">
  <!-- Background with rounded corners -->
  <rect width="180" height="180" rx="40" fill="#ffffff"/>

  <!-- Radial ripple visualization - concentric circles -->
  <!-- Center dot -->
  <circle cx="90" cy="90" r="10" fill="hsl(200, 100%, 80%)"/>

  <!-- Inner ring -->
  <circle cx="90" cy="90" r="28" fill="none" stroke="hsl(200, 100%, 70%)" stroke-width="10"/>

  <!-- Middle ring -->
  <circle cx="90" cy="90" r="50" fill="none" stroke="hsl(200, 100%, 55%)" stroke-width="10"/>

  <!-- Outer ring -->
  <circle cx="90" cy="90" r="72" fill="none" stroke="hsl(200, 100%, 40%)" stroke-width="10"/>
</svg>
